name: Build Spartanboss JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract mod source
        run: |
          unzip -q spartanboss-1.1.0-balanced-source.zip
          test -f spartanboss_src/build.gradle
          sed -i 's/com\\.geckolib/software.bern ie.geckolib/g' spartanboss_src/build.gradle
          sed -i 's/software.bern ie.geckolib/software.bernie.geckolib/g' spartanboss_src/build.gradle
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build mod JAR
        working-directory: spartanboss_src
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spartanboss-1.1.0
          path: spartanboss_src/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
