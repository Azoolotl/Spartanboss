name: Build Spartanboss JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source and apply Fabric compatibility fixes
        run: |
          unzip -q spartanboss-1.1.0-balanced-source.zip
          test -f spartanboss_src/build.gradle
          python - <<'PY'
          from pathlib import Path

          build_file = Path("spartanboss_src/build.gradle")
          build_text = build_file.read_text()
          build_text = build_text.replace("com.geckolib", "software.bernie.geckolib")
          build_text = build_text.replace("1.14-SNAPSHOT", "1.15.4")
          build_file.write_text(build_text)

          root = Path("spartanboss_src/src/main/java/com/kodari/spartanboss")
          hazard = root / "TemporaryHazardBlock.java"
          source = hazard.read_text()
          source = source.replace("import net.minecraft.block.EntityCollisionHandler;" + chr(10), "")
          start = source.index("    @Override" + chr(10) + "    public void onSteppedOn")
          replacement = """    @Override
              public void onSteppedOn(World world, BlockPos pos, BlockState state, Entity entity) {
                  if (!world.isClient()) {
                      if (burning) {
                          entity.setOnFireFor(2);
                      } else if (spiky && entity instanceof LivingEntity living && living.isAlive()) {
                          living.addStatusEffect(new StatusEffectInstance(StatusEffects.SLOWNESS, 60, 1, false, false));
                          if (world instanceof ServerWorld server) {
                              server.spawnParticles(ParticleTypes.SNOWFLAKE, entity.getX(), entity.getY() + 0.15, entity.getZ(),
                                  4, 0.15, 0.08, 0.15, 0.01);
                              server.spawnParticles(new DustParticleEffect(0x79DFFF, 0.8f),
                                  entity.getX(), entity.getY() + 0.15, entity.getZ(), 2, 0.1, 0.05, 0.1, 0.01);
                          }
                      }
                  }
                  super.onSteppedOn(world, pos, state, entity);
              }
          }
          """
          hazard.write_text(source[:start] + replacement)
          PY

      - name: Apply approved combat and weapon rework
        run: |
          gzip -t patches/spartanboss-rework.patch.gz
          gzip -dc patches/spartanboss-rework.patch.gz > /tmp/spartanboss-rework.patch
          patch --batch --forward -p1 < /tmp/spartanboss-rework.patch

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod JAR
        working-directory: spartanboss_src
        run: gradle clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: spartanboss-1.1.0-final-rework
          path: spartanboss_src/build/libs/spartanboss-1.1.0.jar
          if-no-files-found: error
          retention-days: 14
